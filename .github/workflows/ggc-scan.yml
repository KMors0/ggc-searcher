# Положи этот файл в .github/workflows/ggc-scan.yml в корне репозитория

name: GGC domain scan

on:
  schedule:
    - cron: "0 */12 * * *"   # раз в 12 часов; при желании учащай, но щади резолверы
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    # чуть меньше жёсткого лимита GitHub (360 мин), чтобы job успел
    # сам красиво завершиться, а не быть убитым посреди работы
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true   # нужно, чтобы git push внутри скрипта работал через GITHUB_TOKEN

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install dnspython

      - name: Run scan (скрипт сам коммитит и пушит находки по ходу работы)
        run: >
          python3 find_ggc_domains.py
          --max-num 40
          --max-runtime-min 300
          --commit-every 5
          --commit-interval-sec 600

      # страховка: если скрипт упал до своего финального коммита,
      # ловим и коммитим то, что успело записаться в hosts.txt
      - name: Fallback commit if anything is still uncommitted
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- hosts.txt; then
            git add hosts.txt
            git commit -m "ggc-scan: fallback-коммит оставшихся находок"
            git push
          else
            echo "Изменений нет, коммит не нужен."
          fi
